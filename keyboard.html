<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>스마트 가이드 피아노 V8</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="play-sound.js"></script>
    <script src="play-key.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap');
        
        body { 
            background: #2c3e50; color: white; 
            font-family: 'Gamja Flower', cursive, sans-serif; 
            text-align: center; margin: 0; padding: 10px;
            user-select: none; -webkit-user-select: none;
            display: flex; flex-direction: column; align-items: center;
        }
        
        h1 { margin: 5px 0; font-size: 1.8rem; color: #f1c40f; }

        .container {
            width: 100%; max-width: 700px;
            background: #34495e; border-radius: 15px; padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* 컨트롤 그룹 */
        .control-group {
            background: #222; border-radius: 10px; padding: 10px; margin-bottom: 10px;
            display: flex; flex-direction: column; gap: 8px; border: 1px solid #555;
        }
        .control-row { display: flex; gap: 5px; overflow-x: auto; align-items: center; justify-content: center;}
        .control-label { font-size: 1rem; color: #f1c40f; margin-right: 5px; min-width: 50px; text-align: right;}
        
        .opt-btn {
            background: #444; border: 1px solid #666; color: #ddd; padding: 5px 10px;
            border-radius: 15px; cursor: pointer; white-space: nowrap; font-family: inherit;
        }
        .opt-btn.active { background: #3498db; color: white; border-color: #fff; font-weight: bold; }
        .opt-btn.rhythm.active { background: #e67e22; }

        /* 악보 뷰어 */
        .score-display-area {
            background: #222; border-radius: 10px; padding: 10px; margin-bottom: 10px;
            border: 2px solid #555;
        }
        .score-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; align-items: stretch;
        }
        .score-bar {
            background: #34495e; border: 1px solid #7f8c8d; border-radius: 8px;
            min-height: 50px; display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; color: #ecf0f1; font-weight: bold; position: relative;
        }
        .score-bar.active {
            background: #f1c40f; color: black; border-color: white;
            box-shadow: 0 0 10px #f1c40f; transform: scale(1.05); z-index: 10;
        }
        .bar-number { position: absolute; top: 2px; left: 5px; font-size: 0.6rem; color: #bbb; }
        .score-tools { display:flex; gap:6px; align-items:center; justify-content:flex-end; margin-bottom:6px; font-size:0.85rem; color:#bbb; }
        .score-tools #barCount { margin-right:auto; }
        .tool-btn { background:#3d4b57; border:1px solid #6b7b88; color:#ddd; border-radius:6px; padding:4px 10px; cursor:pointer; font-family:inherit; font-size:0.9rem; }
        .tool-btn:active { background:#e74c3c; }
        .bar-del { position:absolute; top:1px; right:3px; width:20px; height:20px; line-height:18px; text-align:center;
                   background:rgba(0,0,0,.35); color:#ddd; border:none; border-radius:50%; cursor:pointer; font-family:inherit; font-size:0.9rem; padding:0; }
        .bar-del:hover, .bar-del:active { background:#e74c3c; color:#fff; }
        .score-bar.active .bar-del { background:rgba(0,0,0,.25); color:#333; }
        .score-bar.active .bar-number { color: #444; }

        /* 공통 스타일 */
        .key-settings { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 10px; border-bottom: 1px solid #555; }
        .key-btn { background: #555; border: none; padding: 5px 10px; border-radius: 5px; color: #ddd; white-space: nowrap; cursor: pointer; font-family: inherit; }
        .key-btn.active { background: #f1c40f; color: black; font-weight: bold; }

        .tabs { display: flex; gap: 10px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 8px; border: 2px solid #555; border-radius: 8px; background: #2c3e50; color: #aaa; cursor: pointer; font-family: inherit; }
        .tab-btn.active { background: #3498db; color: white; border-color: #3498db; }
        
        .panel { display: none; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 10px; }
        .panel.show { display: block; }
        
        .chord-pad { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 5px; }
        .acc-pad { grid-template-columns: repeat(6, 1fr); }
        .acc-pad .acc { background: #46525c; }
        .acc-pad .acc.active { background: #f1c40f; }
        .acc-flip { background: #34495e; border: 2px dashed #7f8c8d !important; font-size: 0.95rem; }
        .type-pad { display: flex; gap: 5px; margin-bottom: 10px; }
        .input-btn { padding: 8px 0; background: #7f8c8d; border: 2px solid transparent; border-radius: 5px; color: white; cursor: pointer; font-family: inherit; }
        .input-btn.active { background: #f1c40f; color: #222; border-color: #fff; font-weight: bold; }
        .btn-add { background: #2ecc71; width: 100%; padding: 10px; font-size: 1.1rem; border:none; border-radius:8px; color:white; cursor:pointer;}

        .chord-text { width:100%; height:90px; background:#222; color:#eee; border:1px solid #666; border-radius:8px; padding:8px 10px; font-family:inherit; font-size:1rem; resize:vertical; box-sizing:border-box; margin-bottom:8px; }
        .song-list { display:flex; flex-direction:column; gap:5px; max-height:160px; overflow:auto; text-align:left; }
        .song-row { display:flex; align-items:center; gap:6px; background:#222; border:1px solid #555; border-radius:8px; padding:6px 10px; }
        .song-row .nm { flex:1; font-size:0.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .song-row button { background:#444; border:1px solid #666; color:#ddd; border-radius:6px; padding:3px 8px; cursor:pointer; font-family:inherit; }
        .score-bar.half { flex-direction:column; font-size:1rem; line-height:1.2; gap:1px; padding:2px 4px; }
        .score-bar.half span { white-space:nowrap; }
        .score-bar.half.p3 { font-size:.9rem; }
        .score-bar.half.p4 { font-size:.8rem; }
        .nav-controls { display: flex; gap: 10px; justify-content: center; margin: 10px 0; }
        .nav-btn { background: #95a5a6; border: none; padding: 10px; border-radius: 30px; color: white; flex: 1; font-family: inherit; cursor: pointer;}

        .auto-bar { display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; margin:0 0 10px; }
        .auto-btn { background:#2ecc71; border:none; color:#fff; padding:10px 22px; border-radius:30px; font-family:inherit; font-size:1.15rem; cursor:pointer; }
        .auto-btn.on { background:#e74c3c; }
        .auto-opt { font-size:0.95rem; color:#ddd; display:flex; align-items:center; gap:5px; }
        .auto-opt input[type=range] { width:110px; accent-color:#f1c40f; }
        .score-bar.playing { background:#2ecc71; color:#fff; border-color:#fff; }
        .piano-wrap { position: relative; height: 160px; background: #111; border-radius: 10px; display: flex; justify-content: center; padding: 10px 0; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
        .key { position: relative; cursor: pointer; border-radius: 0 0 5px 5px; transition: 0.1s; }
        .white-key { width: 12.5%; height: 100%; background: white; border: 1px solid #ccc; margin: 0; z-index: 1; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px; color: #555; font-weight: bold; font-size: 1.2rem; }
        .black-key { width: 8%; height: 60%; background: black; position: absolute; z-index: 2; top: 10px; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        
        /* 태블릿·노트북 가로 화면: 폭을 넓히고 건반·글씨를 크게 */
        @media (min-width: 820px) {
            body { padding: 10px 16px; }
            .container { max-width: 1200px; padding: 14px 18px; }
            h1 { font-size: 2.2rem; }
            .score-grid { grid-template-columns: repeat(8, 1fr); }
            .score-bar { min-height: 60px; font-size: 1.5rem; }
            .score-bar.half { font-size: 1.15rem; }
            .input-btn { padding: 11px 0; font-size: 1.2rem; }
            .btn-add { font-size: 1.3rem; padding: 12px; }
            .opt-btn, .key-btn { font-size: 1.05rem; padding: 7px 14px; }
            .piano-wrap { height: 230px; }
            .white-key { font-size: 1.5rem; }
        }
        /* 가로 화면: 위쪽 코드 악보와 아래쪽 건반이 스크롤해도 항상 보이게 */
        @media (min-width: 820px) and (orientation: landscape) {
            h1 { font-size: 1.7rem; margin: 0 0 3px; }
            #duetLink { margin: 0 0 8px !important; padding: 6px 20px 5px !important; }
            .container { padding-top: 6px; }
            .control-group { padding: 7px; gap: 6px; margin-bottom: 7px; }
            .score-display-area {
                position: sticky; top: 0; z-index: 20; margin-bottom: 8px;
                background: #1b2733; box-shadow: 0 6px 14px rgba(0,0,0,.45);
                padding-left: 104px;   /* 왼쪽 위 '연주실' 버튼에 코드가 가리지 않게 */
            }
            .score-bar { min-height: 52px; font-size: 1.35rem; }
            .piano-wrap {
                position: sticky; bottom: 6px; z-index: 20;
                height: min(210px, 26vh); margin-top: 8px;
            }
            .panel { padding: 8px; }
            .nav-controls, .auto-bar { margin: 7px 0; }
        }
        @media (min-width: 1250px) { .container { max-width: 1400px; } }

        .duet-rhythm { display:flex; gap:6px; align-items:center; justify-content:center; flex-wrap:wrap; margin-bottom:6px; }
        .duet-opt.active { background:#0E9F87; border-color:#fff; color:#fff; font-weight:bold; }

        .guide-on { background: #f1c40f !important; box-shadow: 0 0 15px #f1c40f inset; }
        .key-pressed { transform: translateY(3px); background: #e74c3c !important; }

        #start-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h1>🎹 스마트 가이드 V8</h1>
        <p id="load-msg">진짜 악기 소리를 불러오는 중…</p>
        <button onclick="startApp()" style="padding:15px 30px; font-size:1.5rem; background:#f1c40f; border:none; border-radius:50px; cursor:pointer;">수업 시작하기</button>
    </div>

    <h1>🎵 Smart Guide Piano</h1>
    <a id="duetLink" href="duet.html" style="display:inline-block;margin:2px 0 10px;padding:8px 22px 7px;border-radius:22px;background:#0E9F87;color:#fff;text-decoration:none;border:2px solid rgba(255,255,255,.85);box-shadow:0 3px 0 #07695A;line-height:1.35"><span style="display:block;font-size:1.2rem;font-weight:700">👫 짝꿍 피아노실 들어가기 ▶</span><span style="display:block;font-size:.9rem;opacity:.9">여기를 눌러요 · 둘이서 멜로디·화음 2중주</span></a>
    <script>if(window.EAIMKey){ document.getElementById('duetLink').href=EAIMKey.link('duet.html'); }</script>

    <div class="container">
        
        <div class="control-group">
            <div class="control-row">
                <span class="control-label">악기</span>
                <button class="opt-btn active" onclick="setInst('piano', this)">🎹 피아노</button>
                <button class="opt-btn" onclick="setInst('synth', this)">🎹 신디</button>
                <button class="opt-btn" onclick="setInst('strings', this)">🎻 스트링</button>
                <button class="opt-btn" onclick="setInst('brass', this)">🎺 브라스</button>
                <button class="opt-btn" onclick="setInst('xylo', this)">🔨 실로폰</button>
            </div>
            <div class="control-row">
                <span class="control-label">반주</span>
                <button class="opt-btn rhythm active" onclick="setRhythm('none', this)">없음</button>
                <button class="opt-btn rhythm" onclick="setRhythm('kpop', this)">K-pop 발라드</button>
                <button class="opt-btn rhythm" onclick="setRhythm('pop16', this)">16비트 팝</button>
                <button class="opt-btn rhythm" onclick="setRhythm('rnb', this)">R&B</button>
                <button class="opt-btn rhythm" onclick="setRhythm('dance', this)">댄스</button>
                <button class="opt-btn rhythm" onclick="setRhythm('synth', this)">신스팝</button>
                <button class="opt-btn rhythm" onclick="setRhythm('ballad', this)">발라드 기본</button>
                <button class="opt-btn rhythm" onclick="setRhythm('beat4', this)">4비트</button>
                <button class="opt-btn rhythm" onclick="setRhythm('beat8', this)">8비트</button>
                <button class="opt-btn rhythm" onclick="setRhythm('whole', this)">온음</button>
                <button class="opt-btn rhythm" onclick="setRhythm('waltz', this)">왈츠 3박</button>
            </div>
        </div>

        <div style="text-align:left; color:#ccc; font-size:0.8rem; margin-bottom:5px;">Step 1. 악보 Key</div>
        <div class="key-settings" id="key-buttons"></div>

        <div class="score-display-area">
            <div class="score-tools">
                <span id="barCount">0마디</span>
                <button class="tool-btn" onclick="undoChord()">↩ 마지막 지우기</button>
                <button class="tool-btn" onclick="clearChords()">🗑 전체 지우기</button>
            </div>
            <div class="score-grid" id="score-board">
                <span style="grid-column: 1 / -1; color:#666; padding:10px;">코드를 입력하세요</span>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="setTab('manual')">✍️ 하나씩</button>
            <button class="tab-btn" onclick="setTab('text')">📝 한 줄로 붙여넣기</button>
            <button class="tab-btn" onclick="setTab('song')">💾 곡 저장·불러오기</button>
        </div>

        <div id="panel-manual" class="panel show">
            <div class="chord-pad">
                <button class="input-btn" data-root="C" onclick="selRoot('C')">C</button>
                <button class="input-btn" data-root="D" onclick="selRoot('D')">D</button>
                <button class="input-btn" data-root="E" onclick="selRoot('E')">E</button>
                <button class="input-btn" data-root="F" onclick="selRoot('F')">F</button>
                <button class="input-btn" data-root="G" onclick="selRoot('G')">G</button>
                <button class="input-btn" data-root="A" onclick="selRoot('A')">A</button>
                <button class="input-btn" data-root="B" onclick="selRoot('B')">B</button>
            </div>
            <div class="chord-pad acc-pad">
                <button class="input-btn acc" onclick="selRoot(this.dataset.root)"></button>
                <button class="input-btn acc" onclick="selRoot(this.dataset.root)"></button>
                <button class="input-btn acc" onclick="selRoot(this.dataset.root)"></button>
                <button class="input-btn acc" onclick="selRoot(this.dataset.root)"></button>
                <button class="input-btn acc" onclick="selRoot(this.dataset.root)"></button>
                <button class="input-btn acc-flip" onclick="flipAcc()" title="올림표와 내림표 바꾸기">♯↔♭</button>
            </div>
            <div class="type-pad" style="flex-wrap:wrap;">
                <button class="input-btn" style="flex:1" onclick="selType('')">Maj</button>
                <button class="input-btn" style="flex:1" onclick="selType('m')">m</button>
                <button class="input-btn" style="flex:1" onclick="selType('7')">7</button>
                <button class="input-btn" style="flex:1" onclick="selType('maj7')">maj7</button>
                <button class="input-btn" style="flex:1" onclick="selType('m7')">m7</button>
                <button class="input-btn" style="flex:1" onclick="selType('add9')">add9</button>
                <button class="input-btn" style="flex:1" onclick="selType('sus2')">sus2</button>
                <button class="input-btn" style="flex:1" onclick="selType('sus4')">sus4</button>
            </div>
            <div style="display:grid;grid-template-columns:1fr auto;gap:5px">
                <button class="btn-add" onclick="addChordManual()">⬇️ 새 마디에 넣기 (<span id="preview-chord">C</span>)<br><small style="font-weight:normal;opacity:.85">마디 하나를 통째로 — 4박</small></button>
                <button class="btn-add" style="background:#2980b9;width:auto;padding:8px 14px" onclick="addChordManual(true)" title="앞 마디를 나눠서 그 마디 안에 이어 넣어요">➕ 앞 마디 나눠 넣기<br><small style="font-weight:normal;opacity:.85">2박 → 1박씩으로</small></button>
            </div>
        </div>

        <div id="panel-text" class="panel">
            <textarea id="chordText" class="chord-text" placeholder="예)  Cadd9  G/B  Am7  Fmaj7 | Dm7  G7sus4  Cmaj7  C
· 띄어쓰기 = 마디, | 는 보기용
· 띄어쓰기 = 마디 나누기,  붙임표 = 마디 안 나누기
·  C       → 한 마디 전부 C (4박)
·  C-G     → C 2박 + G 2박
·  C-F-G-Am → 네 코드를 1박씩
· add9, sus2, sus4, maj7, m7, 9, 6, dim 다 돼요. 분수코드 G/B 도 OK"></textarea>
            <div style="display:flex; gap:6px;">
                <button class="btn-add" onclick="applyChordText()">⬇ 이 진행으로 넣기</button>
                <button class="btn-add" style="background:#8e44ad;" onclick="aiProgression()" title="분위기·가사를 주면 Gemini가 코드 진행을 만들어요">✨ AI에게 코드 진행 부탁</button>
                <button class="btn-add" style="background:#6c5ce7;" onclick="importFromProduction()" title="같은 주소에 뮤지컬메이커가 있을 때">🎬 넘버 코드 받기</button>
            </div>
            <div id="importMsg" style="font-size:0.85rem; color:#ccc; margin-top:6px; text-align:left;"></div>
        </div>
        <div id="panel-song" class="panel">
            <div style="display:flex; gap:6px; margin-bottom:8px;">
                <input id="songName" class="chord-text" style="height:auto; flex:1;" placeholder="곡 이름 (예: 봄날의 이야기 1막)">
                <button class="btn-add" style="width:auto; padding:8px 14px;" onclick="saveSong()">💾 저장</button>
            </div>
            <div id="songList" class="song-list"></div>
        </div>

        <div class="nav-controls">
            <button class="nav-btn" onclick="moveStep(-1)">◀ 이전</button>
            <button class="nav-btn" onclick="moveStep(1)">다음 ▶</button>
        </div>
        <div class="auto-bar">
            <button class="auto-btn" id="autoBtn" onclick="toggleAuto()">▶ 자동 반주</button>
            <label class="auto-opt">빠르기 <input type="range" id="bpm" min="60" max="160" value="90" oninput="setBpm(this.value)"> <span id="bpmLbl">90</span></label>
            <label class="auto-opt"><input type="checkbox" id="metro" checked> 메트로놈</label>
            <label class="auto-opt"><input type="checkbox" id="loopChk" checked> 반복</label>
        </div>
        <div style="text-align:center;margin:8px 0 4px">
            <div class="duet-rhythm">
                <span class="control-label" style="min-width:auto">코드 짚는 박자</span>
                <button class="opt-btn duet-opt active" data-hit="bar" onclick="setDuetHit('bar')">한 마디에 한 번</button>
                <button class="opt-btn duet-opt" data-hit="half" onclick="setDuetHit('half')">2박마다</button>
                <button class="opt-btn duet-opt" data-hit="beat" onclick="setDuetHit('beat')">4비트 (매 박)</button>
            </div>
            <button onclick="goDuetPractice()" style="background:#0E9F87;color:#fff;border:2px solid rgba(255,255,255,.85);border-radius:22px;padding:9px 20px;font:inherit;font-size:1.05rem;cursor:pointer;box-shadow:0 3px 0 #07695A">🎹 이 코드 진행 박자 맞춰 연습하기 ▶</button>
        </div>
        
        <div class="piano-wrap" id="piano"></div>
        <div style="margin-top:5px; color:#aaa; font-size:0.8rem;">반주를 고르고 ▶ 자동 반주를 누르면 마디마다 코드가 넘어가요. 그 위에서 노란 건반을 짚어 보세요!<br>한 마디에 코드가 여럿이면 <b>➕ 같은 마디에</b>로 넣거나 <b>C-F</b>, <b>C-F-G-Am</b>처럼 붙여 쓰면 박이 나뉘어요.</div>

    </div>

    <div id="errbar" style="display:none;position:fixed;top:0;left:0;right:0;z-index:2000;background:#c0392b;color:#fff;padding:8px 12px;font-size:.85rem;text-align:center"></div>
    <script>
        window.addEventListener('error', e => { const b = document.getElementById('errbar'); b.style.display = 'block'; b.textContent = '⚠️ 오류: ' + e.message + ' (' + (e.lineno||'') + '줄)'; });
        window.addEventListener('unhandledrejection', e => { const b = document.getElementById('errbar'); b.style.display = 'block'; b.textContent = '⚠️ 오류: ' + (e.reason && e.reason.message || e.reason); });
        if(!window.EAIMChord){ const b=document.getElementById('errbar'); b.style.display='block'; b.textContent='⚠️ play-sound.js 가 옛 버전이에요 — 최신 play-sound.js 를 저장소에 올리고 시크릿 창으로 다시 여세요'; }
        // --- 오디오 엔진 설정 ---
        let synth;
        const vol = new Tone.Volume(-5).toDestination();
        
        // 악기 프리셋 (브라스 추가됨)
        const instruments = {
            piano: { oscillator: { type: "triangle" }, envelope: { attack: 0.02, decay: 0.1, sustain: 0.3, release: 1 } },
            synth: { oscillator: { type: "square" }, envelope: { attack: 0.05, decay: 0.2, sustain: 0.5, release: 0.5 } },
            strings: { oscillator: { type: "fmsine" }, envelope: { attack: 0.3, decay: 0.5, sustain: 1, release: 2 } },
            brass: { oscillator: { type: "sawtooth" }, envelope: { attack: 0.1, decay: 0.3, sustain: 0.6, release: 0.5 } },
            xylo: { oscillator: { type: "sine" }, envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.1 } }
        };

        const rhythmPatterns = {
            'none': null,
            '4beat': [0, 1, 2, 3],
            'arp': [0, 1, 2, 1],
            'waltz': [0, [1,2], [1,2]]
        };
        
        let currentInst = 'piano';
        let currentRhythm = 'none';
        let isHoldingKey = false;

        const keys = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
        const pianoData = [
            {n:"C4",t:"w",l:"도"}, {n:"C#4",t:"b",l:""}, {n:"D4",t:"w",l:"레"}, {n:"D#4",t:"b",l:""},
            {n:"E4",t:"w",l:"미"}, {n:"F4",t:"w",l:"파"}, {n:"F#4",t:"b",l:""}, {n:"G4",t:"w",l:"솔"},
            {n:"G#4",t:"b",l:""}, {n:"A4",t:"w",l:"라"}, {n:"A#4",t:"b",l:""}, {n:"B4",t:"w",l:"시"}, {n:"C5",t:"w",l:"도"}
        ];

        let songKey = 0; 
        let chordList = [];
        let currentIdx = -1;
        let tempR = 'C', tempT = '';
        let keyElements = {};

        // ── 진짜 악기 샘플 (없으면 합성음으로 대체) ──
        let fallback = null;
        const samplers = {};
        const SAMPLE_MAP = { piano:'piano', synth:'synth', strings:'strings', brass:'brass', xylo:'xylophone' };
        function loadSamplers(){
            if(!window.EAIMSound) return;
            let done=0; const keys=Object.keys(SAMPLE_MAP);
            keys.forEach(k=>{
                try{
                    let sm;
                    sm = EAIMSound.toneSampler(SAMPLE_MAP[k], { release: k==='xylo'?0.3:1,
                        onload: ()=>{ samplers[k]=sm; done++; const m=document.getElementById('load-msg'); if(m) m.textContent = done<keys.length ? `진짜 악기 소리 불러오는 중… (${done}/${keys.length})` : '진짜 악기 소리 준비 완료 🎻'; if(currentInst===k) updateInstSound(); },
                        onerror: ()=>{ const m=document.getElementById('load-msg'); if(m) m.textContent='악기 샘플을 못 받아 합성음으로 연주해요'; } });
                    sm.connect(vol);
                }catch(e){ console.warn('sampler', k, e); }
            });
        }
        function init() {
            if(window.EAIMKey){ EAIMKey.ping('건반실','연습'); }
            fallback = new Tone.PolySynth(Tone.Synth).connect(vol);
            synth = fallback;
            loadSamplers();
            updateInstSound();

            const kb = document.getElementById('key-buttons');
            keys.forEach((k, i) => {
                let btn = document.createElement('button');
                btn.className = i===0 ? 'key-btn active' : 'key-btn';
                btn.innerText = k;
                btn.onclick = () => setKey(i, btn);
                kb.appendChild(btn);
            });

            const pw = document.getElementById('piano');
            pianoData.forEach((d, i) => {
                let k = document.createElement('div');
                k.className = d.t === 'w' ? 'white-key key' : 'black-key key';
                if(d.t==='b') {
                    let whiteCount = pianoData.slice(0, i).filter(x=>x.t==='w').length;
                    k.style.left = (whiteCount * 12.5 - 4) + "%";   // 흰건반 8개 × 12.5%, 검은건반 폭 8%의 절반만큼 왼쪽으로
                }
                if(d.t==='w') k.innerText = d.l;

                const press = (e) => { 
                    if(e) e.preventDefault(); 
                    k.classList.add('key-pressed'); 
                    handleKeyPress(d.n, true); 
                };
                const release = (e) => { 
                    if(e) e.preventDefault(); 
                    k.classList.remove('key-pressed'); 
                    handleKeyPress(d.n, false); 
                };

                k.addEventListener('mousedown', press); k.addEventListener('mouseup', release);
                k.addEventListener('mouseleave', release);
                k.addEventListener('touchstart', press); k.addEventListener('touchend', release);

                pw.appendChild(k);
                keyElements[d.n] = k;
            });
        }

        async function startApp() { 
            await Tone.start(); 
            Tone.Transport.bpm.value = 90;
            document.getElementById('start-overlay').style.display = 'none'; 
        }

        function setInst(type, btn) {
            currentInst = type;
            btn.parentNode.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            try { updateInstSound(); } catch(e) { console.error(e); const b = document.getElementById('errbar'); b.style.display='block'; b.textContent = '⚠️ 악기 바꾸기 오류: ' + e.message; }
            const m = document.getElementById('load-msg');
            if (!samplers[type]) { /* 아직 샘플이 안 왔으면 합성음으로 */ }
        }
        function updateInstSound() {
            if(synth) { try{ synth.releaseAll(); }catch(e){} }
            if(samplers[currentInst]) { synth = samplers[currentInst]; }
            else { synth = fallback; fallback.set(instruments[currentInst]); }
        }

        function setRhythm(type, btn) {
            currentRhythm = type;
            btn.parentNode.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            if (autoPlaying) stopAuto();
            Tone.Transport.stop(); Tone.Transport.cancel();
            if(isHoldingKey) handleKeyPress(null, false);
            renderScoreBoard();   // 3박·4박이 바뀌면 마디 안의 박 나눔도 다시 계산
        }

        function handleKeyPress(inputNote, isPressed) {
            if(!inputNote && !isPressed) { synth.releaseAll(); isHoldingKey = false; Tone.Transport.stop(); return; }

            // 누른 건반 소리 (악보 Key만큼 옮겨서)
            const single = [Tone.Frequency(inputNote).transpose(songKey).toNote()];
            // 현재 코드 소리 (리듬 반주용)
            let chordNotes = null;
            if(currentIdx !== -1 && chordList[currentIdx]) {
                chordNotes = chordNotesOf(chordList[currentIdx]);
            }
            // 리듬이 꺼져 있으면 누른 음이 그대로 나고, 리듬을 켜면 코드 반주 패턴이 나옴
            let targetNotes = (currentRhythm === 'none' || !chordNotes || autoPlaying) ? single : chordNotes;

            if (isPressed) {
                isHoldingKey = true;
                if (currentRhythm === 'none' || autoPlaying) {
                    synth.triggerAttack(targetNotes);
                } else {
                    startRhythmPattern(targetNotes);
                }
            } else {
                isHoldingKey = false;
                if (autoPlaying) {
                    synth.triggerRelease(targetNotes);
                } else if (currentRhythm === 'none') {
                    synth.releaseAll();
                } else {
                    Tone.Transport.stop(); synth.releaseAll();
                }
            }
        }

        function startRhythmPattern(notes) {
            Tone.Transport.stop(); Tone.Transport.cancel();
            const c = (currentIdx !== -1 && chordList[currentIdx]) ? transposed(chordList[currentIdx]) : EAIMChord.parse(Tone.Frequency(notes[0]).toNote().replace(/\d/,''));
            const P = EAIMChord.PATTERNS[currentRhythm] || EAIMChord.PATTERNS.beat4;
            Tone.Transport.timeSignature = P.beats;
            const beat = Tone.Time('4n').toSeconds();
            new Tone.Loop((time) => {
                EAIMChord.renderPattern(currentRhythm, c, (ns, at, len, vel) => synth.triggerAttackRelease(ns, len * beat, time + at * beat, vel), P.beats);
            }, '1m').start(0);
            Tone.Transport.start();
        }

        // ══ 자동 반주: 마디마다 코드가 넘어가며 반주 패턴이 흐름 ══
        let autoPlaying = false, autoLoop = null, autoIdx = 0;
        let metro = null;
        const SHARPS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
        const pcIdx = (r) => { const i = SHARPS.indexOf(r); return i >= 0 ? i : keys.indexOf(r); };
        function transposed(c) {   // 악보 Key 만큼 옮긴 코드 객체 (음이름은 공용 코드 모듈과 같은 샵 표기)
            const sh = (r) => SHARPS[((pcIdx(r) - songKey) + 12) % 12];
            return { ...c, root: sh(c.root), bass: c.bass ? sh(c.bass) : null, intervals: c.intervals || (c.type === 'm' ? [0,3,7] : c.type === '7' ? [0,4,7,10] : [0,4,7]) };
        }
        function chordNotesOf(c) { return EAIMChord.voicing(transposed(c), 4); }
        let duetHit = 'bar';
        function setDuetHit(v) { duetHit = v; document.querySelectorAll('.duet-opt').forEach(b => b.classList.toggle('active', b.dataset.hit === v)); }
        function goDuetPractice() {   // 건반실에서 확인한 코드 진행을 짝꿍 피아노실(화음 연습 화면)로 넘기기
            if (!chordList.length) { alert('먼저 코드를 넣어주세요 (예: C · Dm · G · C)'); return; }
            const beats = ((EAIMChord.PATTERNS[currentRhythm] || {}).beats === 3) ? 3 : 4;
            const nm = (c) => { const t = transposed(c), f = wantFlat(c); const suf = String(c.name || '').split(' - ')[0].replace(/^[A-G][#b]?/, '').replace(/\/[A-G][#b]?$/, ''); return spellRoot(t.root, f) + suf + (t.bass ? '/' + spellRoot(t.bass, f) : ''); };
            /* 고른 리듬대로 박 칸 채우기: -는 이어 누르기, 코드 이름은 그 박에 새로 잡기 */
            const cells = (a, n) => {
                if (duetHit === 'beat') return Array(n).fill(a);                       // 4비트: 매 박마다
                if (duetHit === 'half') { const out = []; for (let i = 0; i < n; i++) out.push(i % 2 === 0 ? a : '-'); return out; }
                return [a, ...Array(n - 1).fill('-')];                                  // 한 마디에 한 번
            };
            const bars = chordList.map(c => {
                const list = partsOf(c), sp = splitBeats(list.length, beats);
                return list.map((ch, k) => cells(nm(ch), sp[k])).flat().join(' ');
            });
            const lines = []; for (let i = 0; i < bars.length; i += 4) lines.push(bars.slice(i, i + 4).join(' | ') + ' |');
            const title = (document.getElementById('songName').value.trim() || '코드 진행 연습') + (songKey ? ' (쉬운 자리로 옮김)' : '');
            try { localStorage.setItem('eaim_duet_import', JSON.stringify({ title, bpm: +document.getElementById('bpm').value || 90, melody: '', chords: lines.join('\n'), ts: Date.now() })); } catch (e) {}
            if (autoPlaying) stopAuto();
            location.href = window.EAIMKey ? EAIMKey.link('duet.html') : 'duet.html';
        }
        function setBpm(v) { Tone.Transport.bpm.value = Number(v); document.getElementById('bpmLbl').textContent = v; }
        function toggleAuto() {
            if (autoPlaying) { stopAuto(); return; }
            if (chordList.length === 0) { alert('먼저 코드를 넣어주세요 (예: C · Dm · G · C)'); return; }
            if (currentRhythm === 'none') { alert('반주 종류를 하나 고르세요 (K-pop 발라드, 16비트 팝 등)'); return; }
            startAuto();
        }
        function startAuto() {
            Tone.Transport.stop(); Tone.Transport.cancel(); synth.releaseAll();
            const isWaltz = (EAIMChord.PATTERNS[currentRhythm] || {}).beats === 3;
            Tone.Transport.timeSignature = isWaltz ? 3 : 4;
            if (!metro) { metro = new Tone.Synth({ oscillator:{type:'sine'}, envelope:{attack:0.001, decay:0.05, sustain:0, release:0.02} }).connect(vol); metro.volume.value = -8; }
            autoIdx = 0; autoPlaying = true;
            document.getElementById('autoBtn').textContent = '■ 정지'; document.getElementById('autoBtn').classList.add('on');

            const beat = Tone.Time('4n').toSeconds();
            const beats = isWaltz ? 3 : 4;
            autoLoop = new Tone.Loop((time) => {
                if (autoIdx >= chordList.length) {
                    if (document.getElementById('loopChk').checked) autoIdx = 0;
                    else { Tone.Draw.schedule(() => stopAuto(), time + 0.01); return; }
                }
                const c = chordList[autoIdx];
                const hit = (grp, t, dur) => synth.triggerAttackRelease(grp, dur, t);
                const playChord = (ch, t0, nb) => {   // nb = 이 코드가 차지하는 박 수
                    EAIMChord.renderPattern(currentRhythm, transposed(ch), (ns, at, len, vel) => { if (at < nb) synth.triggerAttackRelease(ns, Math.min(len, nb - at) * beat, t0 + at * beat, vel); }, nb);
                };
                const list = partsOf(c), sp = splitBeats(list.length, beats);
                let at = 0;
                list.forEach((ch, k) => {
                    playChord(ch, time + at * beat, sp[k]);
                    const a0 = at, idx0 = autoIdx;
                    Tone.Draw.schedule(() => { currentIdx = idx0; curPart = k; renderScoreBoard(); updateGuide(); }, time + a0 * beat);
                    at += sp[k];
                });
                if (document.getElementById('metro').checked) for (let b = 0; b < beats; b++) metro.triggerAttackRelease(b === 0 ? 'C6' : 'G5', '32n', time + b*beat);
                const idxNow = autoIdx;
                Tone.Draw.schedule(() => { document.querySelectorAll('.score-bar')[idxNow]?.classList.add('playing'); }, time);
                autoIdx++;
            }, '1m').start(0);
            Tone.Transport.start('+0.1');
        }
        function stopAuto() {
            autoPlaying = false;
            if (autoLoop) { autoLoop.stop(); autoLoop.dispose(); autoLoop = null; }
            Tone.Transport.stop(); Tone.Transport.cancel(); synth.releaseAll();
            document.getElementById('autoBtn').textContent = '▶ 자동 반주'; document.getElementById('autoBtn').classList.remove('on');
            document.querySelectorAll('.score-bar').forEach(b => b.classList.remove('playing'));
        }

        function setKey(idx, btn) {
            songKey = idx;
            document.querySelectorAll('.key-btn').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            updateGuide(); renderScoreBoard();
        }

        function setTab(mode) {
            const idx = { manual:0, text:1, song:2 }[mode] ?? 0;
            document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active', i===idx));
            document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));
            document.getElementById('panel-' + mode).classList.add('show');
            if (mode === 'song') renderSongList();
        }

        /* 검은 건반 근음: ♯ 표기와 ♭ 표기를 버튼 하나로 오갈 수 있어요 */
        const ACC_SHARP = ['C#','D#','F#','G#','A#'], ACC_FLAT = ['Db','Eb','Gb','Ab','Bb'];
        let accFlat = true;   // 악보에 더 흔한 ♭ 표기로 시작
        function renderAcc() {
            const list = accFlat ? ACC_FLAT : ACC_SHARP;
            document.querySelectorAll('.acc-pad .acc').forEach((b, i) => {
                b.dataset.root = list[i];
                b.textContent = list[i].replace('#', '♯').replace('b', '♭');
            });
            markPad();
        }
        function flipAcc() {
            accFlat = !accFlat;
            const i = (accFlat ? ACC_SHARP : ACC_FLAT).indexOf(tempR);
            if (i >= 0) tempR = (accFlat ? ACC_FLAT : ACC_SHARP)[i];   // 고른 코드도 같은 음으로 따라 바뀜
            renderAcc(); updatePreview();
        }
        function selRoot(r) { tempR = r; updatePreview(); markPad(); }
        function selType(t) { tempT = t; updatePreview(); markPad(); }
        function markPad() {
            document.querySelectorAll('.chord-pad .input-btn[data-root]').forEach(b => b.classList.toggle('active', b.dataset.root === tempR));
            const typeLabel = tempT === '' ? 'Maj' : tempT;
            document.querySelectorAll('.type-pad .input-btn').forEach(b => b.classList.toggle('active', b.textContent.trim() === typeLabel));
        }
        function updatePreview() { document.getElementById('preview-chord').innerText = tempR + tempT; }
        
        function addChordManual(sameBar) { try { addChordToData(tempR, tempT, sameBar); } catch(e) { alert('코드 넣기 오류: ' + e.message); console.error(e); } }


        const FLAT2SHARP = { 'C#':'Db', 'D#':'Eb', 'F#':'Gb', 'G#':'Ab', 'A#':'Bb' };
        /* 화면에 보일 코드 이름: 넣을 때 쓴 표기(♭인지 ♯인지)를 그대로 지켜요 */
        const TO_FLAT = { 'C#':'Db', 'D#':'Eb', 'F#':'Gb', 'G#':'Ab', 'A#':'Bb' };
        const wantFlat = (ch) => /b/.test(ch.root || '') || /b/.test(keys[songKey] || '');
        const spellRoot = (r, flat) => (flat ? (TO_FLAT[r] || r) : r);
        function parseChordToken(tok) {
            const c = EAIMChord.parse(tok); if (!c) return null;
            const t = String(tok).trim();
            const rootTyped = /^[A-G][b♭]/.test(t) ? t.slice(0,1) + 'b' : c.root;   // Bb로 적었으면 Bb 그대로 (A#으로 바꾸지 않기)
            const bassM = t.match(/\/([A-G][b♭])/);
            return { root: rootTyped, type: c.type, quality: c.quality, intervals: c.intervals, bass: bassM ? bassM[1][0]+'b' : c.bass, name: c.name };
        }
        function applyChordText() {
            const raw = document.getElementById('chordText').value.replace(/\|/g, ' ').trim();
            if (!raw) return;
            if (autoPlaying) stopAuto();
            const bars = raw.split(/\s+/).map(tok => tok.split(/-(?=[A-G])/).map(parseChordToken).filter(Boolean)).filter(b => b.length);
            if (!bars.length) { alert('읽을 수 있는 코드가 없어요. 예: C G Am F'); return; }
            chordList = bars.map(b => b.length === 1 ? { ...b[0] } : packBar(b));
            currentIdx = 0; renderScoreBoard(); updateGuide();
            document.getElementById('importMsg').textContent = `${chordList.length}마디를 넣었어요`;
        }
        // 저장·불러오기
        const SONG_KEY = 'eaim_keyboard_songs';
        function loadSongs(){ try { return JSON.parse(localStorage.getItem(SONG_KEY) || '[]'); } catch { return []; } }
        function saveSong() {
            const name = document.getElementById('songName').value.trim(); if (!name) { alert('곡 이름을 적어주세요'); return; }
            if (!chordList.length) { alert('저장할 코드가 없어요'); return; }
            const list = loadSongs().filter(x => x.name !== name);
            list.unshift({ name, chords: chordList, key: songKey, rhythm: currentRhythm, bpm: Tone.Transport.bpm.value, ts: Date.now() });
            localStorage.setItem(SONG_KEY, JSON.stringify(list)); renderSongList();
        }
        const RHYTHM_LABEL = Object.fromEntries(Object.entries(EAIMChord.PATTERNS).map(([k,p]) => [k, p.name])); RHYTHM_LABEL.none = '반주 없음';
        function setRhythmByName(name) {
            const btn = [...document.querySelectorAll('.opt-btn.rhythm')].find(b => b.getAttribute('onclick').includes(`'${name}'`));
            if (btn) setRhythm(name, btn);
        }
        function loadSong(sng) {
            if (autoPlaying) stopAuto();
            chordList = JSON.parse(JSON.stringify(sng.chords));
            songKey = sng.key || 0; document.querySelectorAll('.key-btn').forEach((b,j)=>b.classList.toggle('active', j===songKey));
            if (sng.rhythm) setRhythmByName(sng.rhythm);
            if (sng.bpm) { document.getElementById('bpm').value = Math.round(sng.bpm); setBpm(Math.round(sng.bpm)); }
            document.getElementById('songName').value = sng.name;
            currentIdx = 0; renderScoreBoard(); updateGuide();
            setTab('manual');
            document.getElementById('score-board').scrollIntoView({ behavior:'smooth', block:'center' });
        }
        function renderSongList() {
            const el = document.getElementById('songList'); const list = loadSongs();
            el.innerHTML = list.length ? '' : '<div style="color:#888; font-size:0.9rem; text-align:center;">저장된 곡이 없어요</div>';
            list.forEach((sng, i) => {
                const row = document.createElement('div'); row.className = 'song-row';
                row.innerHTML = `<span class="nm">🎵 ${sng.name} <small style="color:#888">(${sng.chords.length}마디 · ${RHYTHM_LABEL[sng.rhythm] || '반주 없음'})</small></span><button style="background:#2ecc71;color:#fff;border-color:#2ecc71">▶ 바로 연주</button><button>불러오기</button><button>삭제</button>`;
                const btns = row.querySelectorAll('button');
                btns[0].onclick = () => { loadSong(sng); if (currentRhythm === 'none') setRhythmByName('ballad'); startAuto(); };
                btns[1].onclick = () => loadSong(sng);
                btns[2].onclick = () => { if (!confirm(`"${sng.name}"을 지울까요?`)) return; const l = loadSongs(); l.splice(i,1); localStorage.setItem(SONG_KEY, JSON.stringify(l)); renderSongList(); };
                el.appendChild(row);
            });
        }
        // 분위기·가사 → Gemini 코드 진행
        async function aiProgression() {
            const msg = document.getElementById('importMsg');
            const desc = prompt('어떤 곡인가요? 분위기·장르·가사 일부를 적어주세요.\n예) 설레는 봄 K-pop 발라드, "바람이 불어오는 이 교정 위에"', '');
            if (!desc) return;
            msg.textContent = '코드 진행을 만들고 있어요…';
            try {
                const d = await EAIMKey.gemini(`중학생 반주용 코드 진행을 만들어 주세요. 8~16마디, 다이아토닉 위주에 요즘 팝처럼 add9·sus4·maj7·m7·분수코드(G/B)를 자연스럽게 섞어도 좋아요. 조는 C, G, D, F, Am, Em 중. dim·aug·13 같은 건 금지.
JSON만: {"key":"C","bpm":90,"chords":"Cadd9 G/B Am7 Fmaj7 | Dm7 G7sus4 C C"}  (마디는 공백, 한 마디 두 코드는 "C-G")
설명: ${desc}`, { json: true, temperature: .7, maxTokens: 300 });
                document.getElementById('chordText').value = d.chords || ''; applyChordText();
                if (d.bpm) { document.getElementById('bpm').value = d.bpm; setBpm(d.bpm); }
                document.getElementById('songName').value = desc.slice(0, 20);
                msg.textContent = `✅ ${chordList.length}마디 (${d.key || ''}, ${d.bpm || ''} BPM) — 위 칸에서 고쳐 다시 넣어도 돼요`;
            } catch (e) { msg.textContent = '❌ ' + e.message; }
        }
        // 프로덕션(뮤지컬메이커) 넘버 → Gemini가 코드 진행 생성
        async function importFromProduction() {
            const msg = document.getElementById('importMsg');
            let d = null; try { d = JSON.parse(localStorage.getItem('mm_draft') || localStorage.getItem('eaim_musical_data') || 'null'); } catch {}
            const apiKey = await EAIMKey.get();
            if (!d) { msg.textContent = '뮤지컬메이커 작품이 이 기기(같은 주소)에 없어요. 대신 "한 줄로 붙여넣기"에 코드를 직접 넣거나, 아래 AI에게 코드 진행을 부탁할 수 있어요.'; return; }
            if (!apiKey) { msg.textContent = EAIMKey.NO_KEY_MSG; return; }
            const numbers = [];
            if (d.opening?.songTitle) numbers.push({ label: '오프닝 · ' + d.opening.songTitle, lyrics: d.opening.lyrics, style: d.opening.sunoPrompt });
            (d.scenes || []).forEach((sc, i) => { if (sc.songTitle) numbers.push({ label: `${i+1}막 · ${sc.songTitle}`, lyrics: sc.lyrics, style: sc.sunoPrompt }); });
            if (d.curtain?.songTitle) numbers.push({ label: '커튼콜 · ' + d.curtain.songTitle, lyrics: d.curtain.lyrics, style: d.curtain.sunoPrompt });
            if (d.song?.title) numbers.push({ label: '낭독극 · ' + d.song.title, lyrics: d.song.lyrics, style: d.song.sunoPrompt });
            if (!numbers.length) { msg.textContent = '작품에 넘버가 없어요.'; return; }
            const pick = prompt('어느 넘버의 코드를 받을까요? 번호를 입력하세요.\n' + numbers.map((n,i)=>`${i+1}. ${n.label}`).join('\n'), '1');
            const n = numbers[Number(pick) - 1]; if (!n) return;
            msg.textContent = '코드 진행을 만들고 있어요…';
            try {
                const data = await EAIMKey.gemini(
`중학생 뮤지컬 넘버의 피아노 반주용 코드 진행을 만들어 주세요. 가사 한 줄을 대략 두 마디로 보고, 8~24마디 안에서 자연스러운 진행(다이아토닉 위주, I-V-vi-IV 같은 대중적 패턴)으로. 조는 C, G, D, F, Am, Em 중 하나.
반드시 JSON만 출력: {"key":"C","bpm":90,"chords":"C G Am F | C G F C"}
· chords는 마디를 공백으로 구분, 한 마디에 두 코드면 "C-G" (붙임표)
· 요즘 K-pop처럼 add9, sus4, maj7, m7, 분수코드(G/B)를 자연스럽게 섞어도 좋음. dim·aug·13 같은 건 금지

곡 스타일: ${n.style || ''}
가사:
${(n.lyrics || '').trim()}`, { json: true, temperature: .6, maxTokens: 400 });
                document.getElementById('chordText').value = data.chords || '';
                applyChordText();
                const ki = keys.indexOf(FLAT2SHARP[(data.key||'C').replace('m','')] || (data.key||'C').replace('m',''));
                if (ki >= 0) { songKey = 0; document.querySelectorAll('.key-btn').forEach((b,j)=>b.classList.toggle('active', j===0)); }
                if (data.bpm) { document.getElementById('bpm').value = data.bpm; setBpm(data.bpm); }
                document.getElementById('songName').value = n.label;
                msg.textContent = `✅ "${n.label}" 코드 ${chordList.length}마디 (${data.key||''}, ${data.bpm||''} BPM) — 마음에 안 들면 위 칸에서 고쳐서 다시 넣기`;
            } catch (e) { msg.textContent = '❌ ' + e.message; }
        }

        /* 한 마디 안의 코드들 — 마디를 고르게 나눠 가져요 (C-F = 2박씩, C-F-G-Am = 1박씩) */
        const partsOf = (c) => c.parts || (c.second ? [c, c.second] : [c]);
        function packBar(list) {
            const parts = list.slice(0, 4);
            return { ...parts[0], name: parts.map(c => c.name).join(' - '), parts, second: parts[1] || null };
        }
        function splitBeats(n, beats) {   // 박을 코드 수만큼 나눔 (4박 3코드 → 2·1·1)
            const base = Math.floor(beats / n); let rest = beats - base * n;
            return Array.from({ length: n }, () => base + (rest-- > 0 ? 1 : 0));
        }
        function addChordToData(root, type, sameBar) {
            const c = parseChordToken(root + type) || { name: root+type, root, type, quality: type, intervals: [0,4,7] };
            if (sameBar && chordList.length) {
                const last = chordList[chordList.length - 1], list = partsOf(last);
                if (list.length >= 4) { alert('한 마디에는 코드 4개까지 넣을 수 있어요'); return; }
                chordList[chordList.length - 1] = packBar([...list, c]);
            } else chordList.push(c);
            renderScoreBoard();
            if(currentIdx === -1) { currentIdx = 0; renderScoreBoard(); updateGuide(); }
        }

        /* 넣은 코드 지우기 */
        function afterChange() {
            if (autoPlaying) stopAuto();
            if (chordList.length === 0) currentIdx = -1;
            else currentIdx = Math.max(0, Math.min(currentIdx, chordList.length - 1));
            renderScoreBoard(); updateGuide();
        }
        function removeChordAt(i) { chordList.splice(i, 1); afterChange(); }
        function undoChord() { if (!chordList.length) return; chordList.pop(); afterChange(); }
        function clearChords() { if (!chordList.length) return; if (!confirm('넣은 코드를 모두 지울까요?')) return; chordList = []; afterChange(); }

        function renderScoreBoard() {
            const board = document.getElementById('score-board');
            board.innerHTML = "";
            const bc0 = document.getElementById('barCount'); if (bc0) bc0.textContent = chordList.length + '마디';
            if(chordList.length === 0) { board.innerHTML = "<span style='grid-column:1/-1; padding:10px; color:#666;'>코드 없음</span>"; return; }
            chordList.forEach((c, i) => {
                let div = document.createElement('div');
                div.className = `score-bar ${i === currentIdx ? 'active' : ''}`;
                div.onclick = () => { currentIdx = i; curPart = 0; renderScoreBoard(); updateGuide(); };
                let num = document.createElement('span'); num.className = 'bar-number'; num.innerText = i + 1; div.appendChild(num);
                const del = document.createElement('button');   // 이 마디만 지우기
                del.className = 'bar-del'; del.textContent = '×'; del.title = (i+1) + '마디 지우기';
                del.onclick = (e) => { e.stopPropagation(); removeChordAt(i); };
                div.appendChild(del);
                const tr = (ch) => { const t = transposed(ch), f = wantFlat(ch); return spellRoot(t.root, f) + (ch.quality ?? ch.type) + (t.bass ? '/' + spellRoot(t.bass, f) : ''); };
                const list = partsOf(c), nb = ((EAIMChord.PATTERNS[currentRhythm] || {}).beats === 3) ? 3 : 4;
                if (list.length > 1) {
                    div.classList.add('half'); div.classList.add('p' + list.length);
                    const sp = splitBeats(list.length, nb);
                    list.forEach((ch, k) => {
                        const el = document.createElement('span');
                        if (!(i === currentIdx && k === curPart)) el.style.opacity = '.8';
                        el.innerHTML = `${tr(ch)}<small style="opacity:.6;margin-left:4px">${sp[k]}박</small>`;
                        div.appendChild(el);
                    });
                } else div.append(tr(c));
                board.appendChild(div);
            });
            const bc = document.getElementById('barCount'); if (bc) bc.textContent = chordList.length + '마디';
            let activeEl = board.querySelector('.active');
            if(activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function moveStep(dir) {
            if(chordList.length === 0) return;
            if (autoPlaying) stopAuto();
            let next = currentIdx + dir;
            if(next >= 0 && next < chordList.length) { currentIdx = next; renderScoreBoard(); updateGuide(); }
        }

        let curPart = 0;
        function updateGuide() {
            document.querySelectorAll('.key').forEach(k=>k.classList.remove('guide-on'));
            if(currentIdx === -1 || !chordList[currentIdx]) return;
            const glist = partsOf(chordList[currentIdx]);
            let target = glist[Math.min(curPart, glist.length - 1)];
            let guideIdx = (pcIdx(target.root) - songKey + 12) % 12;
            let iv = target.intervals || (target.type === 'm' ? [0,3,7] : target.type === '7' ? [0,4,7,10] : [0,4,7]);
            let notes = iv.map(i => SHARPS[(guideIdx + i) % 12]);
            notes.forEach(n => {
                let map = n + "4";
                if(keyElements[map]) keyElements[map].classList.add('guide-on');
                if(n==='C' && keyElements['C5']) keyElements['C5'].classList.add('guide-on');
            });
        }

        init(); renderAcc(); markPad();
    </script>
<script src="play-shell.js"></script>
</body>
